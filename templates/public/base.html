{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invex - Controla tu negocio fácil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fuente opcional -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050816;
      --bg-soft: #0f172a;
      --primary: #22c55e;
      --primary-soft: rgba(34,197,94,0.14);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --radius-xl: 18px;
      --radius-full: 999px;
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020817 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 18px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* Header */

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .brand-pill {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-size: 10px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      color: var(--muted);
    }

    .nav-links a:hover { color: var(--primary); }

    .nav-cta {
      padding: 7px 16px;
      border-radius: var(--radius-full);
      background: var(--primary);
      color: #020817;
      font-weight: 600;
      font-size: 13px;
    }

    .nav-cta_2 {
      padding: 7px 16px;
      border-radius: var(--radius-full);
      background: #1f6fd8ff;
      color: #010714ff;
      font-weight: 600;
      font-size: 13px;
    }

    /* Hero */

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(260px, 2.6fr);
      gap: 28px;
      align-items: center;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: rgba(148,163,253,0.06);
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .hero-kicker span {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero p {
      font-size: 13px;
      color: var(--muted);
      max-width: 470px;
      margin-bottom: 20px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .btn-primary {
      padding: 9px 20px;
      border-radius: var(--radius-full);
      background: var(--primary);
      color: #020817;
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }

    .btn-ghost {
      padding: 9px 14px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(148,163,253,0.28);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .hero-note {
      font-size: 10px;
      color: var(--muted);
    }

    .hero-right {
      background: radial-gradient(circle at top, rgba(34,197,94,0.14), transparent),
                  #020817;
      border-radius: var(--radius-xl);
      padding: 14px 14px 14px;
      border: 1px solid rgba(148,163,253,0.14);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-right-title {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .hero-metric {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      color: var(--muted);
    }

    .hero-metric strong {
      font-size: 15px;
      color: var(--primary);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: var(--radius-full);
      background: rgba(15,23,42,0.98);
      border: 1px solid rgba(148,163,253,0.16);
      font-size: 9px;
      color: var(--muted);
    }

    .pill span {
      color: var(--primary);
      font-weight: 600;
      font-size: 10px;
    }

    /* Sección features */

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      font-size: 11px;
    }

    .feature {
      background: rgba(9,9,18,0.98);
      border-radius: var(--radius-xl);
      padding: 10px 11px;
      border: 1px solid rgba(148,163,253,0.14);
    }

    .feature h3 {
      font-size: 11px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .feature p {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    /* Footer mini */

    .footer {
      font-size: 9px;
      color: var(--muted);
      text-align: center;
      padding: 10px 0 16px;
    }

    @media (max-width: 720px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }
  </style>
  
  {% block css %}{% endblock %}
</head>
<body>

    {% block content %}{% endblock %}



    <footer class="footer">
    Invex © {{ now|date:"Y" }} · Multi-tenant Inventory & POS
    </footer>

</body>
<script src="{% static 'public/js/main.js' %}"></script>
{% block js %}{% endblock %}
</html>
